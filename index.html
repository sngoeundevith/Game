<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>លំហាត់ MCQ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{
  --bg:#f3f5fa;--surface:#ffffff;--ink:#142040;--muted:#5b6785;--line:#d9dfec;--soft:#e8edf9;
  --accent:#1e4bd2;--accent-ink:#ffffff;--gold:#b8861b;
  --good:#12805c;--good-bg:#dff3ea;--bad:#c23b3b;--bad-bg:#fbe3e3;
  --f-body:"Battambang",system-ui,sans-serif;
  --f-display:"Moul","Battambang",serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1426;--surface:#161e36;--ink:#e8ecf8;--muted:#9aa6c6;--line:#2a3558;--soft:#1e2847;
  --accent:#6f93ff;--accent-ink:#0e1426;--gold:#e0b04a;
  --good:#4cc79a;--good-bg:#12372c;--bad:#ff8a8a;--bad-bg:#3d1c20;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-block:20px 56px;padding-top:max(20px,env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
img{max-width:100%}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:980px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:64px;height:64px;object-fit:contain;flex:none}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.5;margin:0}
.brand small{color:var(--muted);display:block;line-height:1.4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{margin:0;font-size:18px;line-height:1.5}
.lbl{font-size:14px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;cursor:pointer;line-height:1.6}
.chip small{color:var(--muted);margin-left:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.chip:disabled{opacity:.45;cursor:not-allowed}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 18px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=text],input[type=email],input[type=password],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qtext{font-size:20px;line-height:1.7;margin:0;font-weight:500;overflow-wrap:anywhere}
.rich{white-space:pre-wrap;overflow-wrap:anywhere}
.rich .katex{font-size:1.08em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;min-width:0;width:100%}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:14px;line-height:1}
.opt span{flex:1;min-width:0;overflow-wrap:anywhere}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt[aria-pressed="true"] b{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok b{background:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no b{background:var(--bad);color:var(--surface)}
.opt.static{cursor:default}
.score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:132px;height:132px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--soft) 0)}
.ring div{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.2}
.ring strong{font-family:var(--f-display);font-weight:400;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;flex:1 1 280px}
.stat{background:var(--bg);border-radius:10px;padding:8px 12px}
.stat small{display:block;color:var(--muted);line-height:1.5}
.stat b{font-size:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:13px;line-height:1.6;padding:0 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.tag.sample,.tag.no{background:var(--bad-bg);color:var(--bad)}
.tag.ok{background:var(--good-bg);color:var(--good)}
.tag.wait{background:#fff1cf;color:#8a5a00}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.qrow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qrow p{margin:0;overflow-wrap:anywhere}
.qrow ol{margin:0;padding-left:0;list-style:none;display:grid;gap:2px;font-size:15px;color:var(--muted)}
.qrow li.c{color:var(--good);font-weight:700}
.note{font-size:14px;color:var(--muted);margin:0}
.msg{border-radius:10px;padding:8px 14px;background:var(--soft);font-size:15px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.ok{background:var(--good-bg);color:var(--good)}
.cert img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block}
details.rv{border:1px solid var(--line);border-radius:12px;padding:8px 14px}
details.rv summary{cursor:pointer;display:flex;gap:10px;align-items:flex-start}
details.rv summary span{min-width:0;overflow-wrap:anywhere}
.mark{flex:none;font-weight:700}
.mark.ok{color:var(--good)}.mark.no{color:var(--bad)}
.pubbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.radio-row{display:flex;gap:10px;align-items:center}
.radio-row input[type=radio]{flex:none;width:20px;height:20px;accent-color:var(--accent)}
.urow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.urow .who{min-width:0;overflow-wrap:anywhere}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;padding:0 6px;margin-left:6px;line-height:1}
/* math */
.mathbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mathbar .btn.sm{padding:2px 10px}
.preview{border:1px dashed var(--line);border-radius:10px;padding:6px 12px;font-size:17px}
.preview:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(10,16,34,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(720px,100%);display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:18px}
math-field{width:100%;font-size:28px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);color:var(--ink)}
.menu{display:grid;gap:14px}
.mbtn{display:flex;gap:16px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px 22px;cursor:pointer;width:100%}
.mbtn:hover{border-color:var(--accent)}
.mbtn .ic{font-size:36px;line-height:1;flex:none}
.mbtn b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.6}
.mbtn span{color:var(--muted);font-size:15px}
.code{font-family:var(--f-display);font-size:48px;letter-spacing:.18em;text-align:center;background:var(--bg);border:2px dashed var(--accent);border-radius:14px;padding:6px 0 6px .18em}
.board{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.brow.me{border-color:var(--accent);background:var(--soft)}
.brow .rk{font-weight:700;text-align:center;font-size:20px}
.brow .nm{min-width:0;overflow-wrap:anywhere}
.brow .bar{margin-top:4px;height:6px}
.brow .sc{font-weight:700;white-space:nowrap;text-align:right}
.plist{display:flex;flex-wrap:wrap;gap:8px}

/* live class */
body.liveon{padding:0;background:#0b1634}
.live{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(160deg,#0b1634,#15295c);color:#fff;font-family:var(--f-body)}
.ltop{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;flex-wrap:wrap}
.lbrand{display:flex;gap:12px;align-items:center;min-width:0}
.lbrand img{width:54px;height:54px;object-fit:contain}
.lbrand b{font-family:var(--f-display);font-weight:400;font-size:22px;display:block}
.lbrand small{color:#aab6d8;display:block;line-height:1.4}
.lcode{font-size:clamp(20px,2.4vw,34px)}
.lcode b{font-family:var(--f-display);font-weight:400;letter-spacing:.1em;color:#e7c15a}
.lcnt{font-size:clamp(18px,2vw,28px)}
.lbtn{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:12px;padding:10px 22px;font-size:20px;cursor:pointer;font-family:inherit}
.lbtn.pri{background:#e7c15a;color:#1a2240;border-color:#e7c15a;font-weight:700}
.lbtn:disabled{opacity:.45;cursor:not-allowed}
.lstage{flex:1;padding:8px clamp(16px,4vw,64px) 110px;display:flex;flex-direction:column;gap:clamp(12px,2vh,26px)}
.lhrow{display:flex;justify-content:space-between;align-items:center;gap:16px}
.lhead{font-family:var(--f-display);font-size:clamp(22px,3vw,44px);color:#e7c15a;line-height:1.5}
.ltimer{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,5vw,76px);color:#fff}
.ltimerbar{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.ltimerbar i{display:block;height:100%;width:100%;background:#e7c15a}
.lq{font-size:clamp(26px,4.2vw,68px);line-height:1.5;font-weight:700;overflow-wrap:anywhere}
.lopts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.6vw,24px)}
.lopts.two{grid-template-columns:1fr}
.lopt{display:flex;align-items:center;gap:clamp(10px,1.4vw,20px);padding:clamp(12px,1.6vw,26px);border-radius:16px;font-size:clamp(20px,2.8vw,44px);min-height:clamp(70px,12vh,150px);position:relative;overflow:hidden}
.lopt svg{flex:none;width:clamp(30px,3.6vw,56px);height:auto}
.lopt .lltr{font-family:var(--f-display);font-weight:400;flex:none}
.lopt .lt{flex:1;min-width:0;overflow-wrap:anywhere}
.lopt.dim{opacity:.3}
.lopt.ok{outline:6px solid #fff;box-shadow:0 0 0 12px rgba(255,255,255,.25)}
.lopt .lcnt2{font-size:.65em;font-weight:700;flex:none}
.lopt .lfill{position:absolute;left:0;bottom:0;height:8px;background:rgba(255,255,255,.85)}
.lsum{font-size:clamp(20px,2.6vw,38px);color:#e7c15a;font-weight:700}
.lexp{font-size:clamp(18px,2.2vw,32px);color:#dfe6fb}
.lnote{font-size:clamp(18px,2.2vw,32px);color:#cfd8f3;margin:0}
.lcodebig{font-family:var(--f-display);font-size:clamp(60px,12vw,200px);color:#e7c15a;letter-spacing:.12em;line-height:1.2}
.lnames{display:flex;flex-wrap:wrap;gap:8px}
.lnames span{background:rgba(255,255,255,.12);padding:4px 14px;border-radius:99px;font-size:clamp(16px,1.8vw,26px)}
.lerr{background:#7a1f2b;border-radius:10px;padding:8px 16px;font-size:18px}
.lctl{position:fixed;left:0;right:0;bottom:0;padding:12px 24px;display:flex;gap:12px;justify-content:center;background:rgba(11,22,52,.94);flex-wrap:wrap;z-index:5}
.lrep{display:flex;flex-direction:column;gap:16px}
.lstats{display:flex;gap:16px;flex-wrap:wrap}
.lstats div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 22px}
.lstats small{display:block;color:#aab6d8;font-size:18px}
.lstats b{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,52px)}
.lrow{display:flex;gap:12px;flex-wrap:wrap}
.lsub{font-family:var(--f-display);font-size:clamp(18px,2.2vw,30px);color:#e7c15a;margin-top:6px}
.ltbl{display:flex;flex-direction:column;gap:4px}
.ltr{display:grid;grid-template-columns:70px 1fr 120px 90px;gap:10px;background:rgba(255,255,255,.08);border-radius:10px;padding:6px 14px;font-size:clamp(16px,2vw,28px)}
.ltr .c1,.ltr .c3,.ltr .c4{text-align:center}
.lhard{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 14px;font-size:clamp(16px,1.9vw,26px)}
.lphone{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#0b1634;color:#fff;padding:max(8px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px));font-family:var(--f-body)}
.lptop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 4px;font-size:15px;color:#aab6d8}
.lpleave{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:10px;padding:2px 12px;font-family:inherit;cursor:pointer}
.lpmain{flex:1;display:flex;flex-direction:column;gap:12px;justify-content:center;text-align:center}
.lpq{display:flex;justify-content:space-between;align-items:center;font-size:18px;color:#cfd8f3}
.lpq b{font-family:var(--f-display);font-weight:400;font-size:34px;color:#e7c15a}
.lpgrid{flex:1;display:grid;gap:12px;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;min-height:50vh}
.lpgrid.two{grid-template-columns:1fr}
.lpgrid.odd>.lpbtn:last-child{grid-column:1/-1}
.lpbtn{border:0;border-radius:18px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:clamp(34px,10vw,60px);font-family:var(--f-display);cursor:pointer}
.lpbtn.sel{outline:6px solid #fff;outline-offset:-6px}
.lpmsg{font-family:var(--f-display);font-size:clamp(26px,7vw,40px);line-height:1.5}
.lpmsg.good{color:#7ee2a8}.lpmsg.bad{color:#ff9b9b}
.lpsub{color:#aab6d8;font-size:16px;margin:0}
.lpans{display:flex;gap:10px;align-items:center;justify-content:center;font-size:20px}
.lpchip{display:inline-flex;gap:8px;align-items:center;padding:6px 18px;border-radius:12px;font-family:var(--f-display);font-size:28px}
.lpbigscore{font-family:var(--f-display);font-size:64px;color:#e7c15a}
.lpbig{border:0;background:#e7c15a;color:#1a2240;border-radius:14px;padding:14px 24px;font-size:20px;font-weight:700;font-family:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

var IDX=[];
function hashStr(t,seed){var x=seed;for(var i=0;i<t.length;i++){x=(Math.imul(x,31)+t.charCodeAt(i))|0}return (x>>>0).toString(16)}
function lkey(g,sj,l){var t=sj+"|"+(l||"");return g+"_"+hashStr(t,7)+hashStr(t,131)}
function idxMatch(g,sj,lk){return IDX.filter(function(e){return e.g===g&&e.s===sj&&(lk==="*"||e.l===lk)})}
function availCount(){

}

async function fetchByIds(ids){
  var chunks=[],out=[];
  for(var i=0;i<ids.length;i+=10)chunks.push(ids.slice(i,i+10));
  var FP=window.firebase.firestore.FieldPath;
  var res=await Promise.all(chunks.map(function(c){return fs.collection("questions").where(FP.documentId(),"in",c).get()}));
  res.forEach(function(sn){sn.forEach(function(d){out.push(Object.assign({id:d.id},d.data()))})});
  var pos={};ids.forEach(function(id,i){pos[id]=i});
  out.sort(function(a,b){return pos[a.id]-pos[b.id]});
  return out;
}
async function lessonIds(k){var d=await fs.collection("lessons").doc(k).get();return d.exists?(d.data().ids||[]):[]}
async function fetchQuestions(g,sj,lk,count){
  if(!ONLINE){
    var pl=SAMPLES.filter(function(q){return q.grade===g&&q.subject===sj&&(lk==="*"||q.lesson===lk)});
    return shuffle(pl).slice(0,count);
  }
  var ents=idxMatch(g,sj,lk);
  var lists=await Promise.all(ents.map(function(e){return lessonIds(e.k)}));
  var all=[];lists.forEach(function(l){all=all.concat(l)});
  return fetchByIds(shuffle(all).slice(0,count));
}

function chip(label,count,on,fn){

function picker(box,key,counts,labelFn,title){
  var avail=0;
  box.append(h("div",{class:"lbl"},"ថ្នាក់"));
  var cg=h("div",{class:"chips"});
  GRADES.forEach(function(g){
    cg.append(chip("ថ្នាក់ទី"+kn(g),null,S.grade===g,function(){S.grade=g;S.subject=null;S.lesson="*";render()}));
  });
  box.append(cg);
  if(S.grade!=null){
    var subs=uniq(IDX.filter(function(e){return e.g===S.grade}).map(function(e){return e.s}));
    if(!subs.length){
      box.append(h("p",{class:"note"},"ថ្នាក់នេះមិនទាន់មានលំហាត់ទេ។ សូមជ្រើសថ្នាក់ផ្សេង ឬឱ្យគ្រូបន្ថែមលំហាត់។"));
    }else{
      box.append(h("div",{class:"lbl"},"មុខវិជ្ជា"));
      var cs=h("div",{class:"chips"});
      subs.forEach(function(sj){
        cs.append(chip(sj,null,S.subject===sj,function(){S.subject=sj;S.lesson="*";render()}));
      });
      box.append(cs);
    }
  }
  if(S.grade!=null&&S.subject){
    var ls=uniq(IDX.filter(function(e){return e.g===S.grade&&e.s===S.subject}).map(function(e){return e.l}));
    box.append(h("div",{class:"lbl"},"មេរៀន"));
    var cl=h("div",{class:"chips"});
    cl.append(chip("គ្រប់មេរៀន",null,S.lesson==="*",function(){S.lesson="*";render()}));
    ls.forEach(function(l){
      cl.append(chip(l||"(មិនមានឈ្មោះមេរៀន)",null,S.lesson===l,function(){S.lesson=l;render()}));
    });
    box.append(cl);
    avail=availCount();
    var okc=counts.filter(function(n){return avail>=n});
    if(okc.length&&okc.indexOf(S[key])<0)S[key]=okc[okc.length-1];
    if(!okc.length)S[key]=counts[0];
    box.append(h("div",{class:"lbl"},title));
    var cc=h("div",{class:"chips"});
    counts.forEach(function(n){
      var on=avail>=n,lab=labelFn(n);
      cc.append(h("button",{class:"chip","aria-pressed":S[key]===n&&on?"true":"false",disabled:!on,onclick:function(){S[key]=n;render()}},
        kn(n)+" សំណួរ",lab?h("small",{},lab):null));
    });
    box.append(cc);
  }
  return avail;
}

function certId(){
  var d=new Date();
  return "QCM-"+String(d.getFullYear()).slice(2)+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+"-"+Math.random().toString(36).slice(2,6).toUpperCase();

async function startQuiz(){
  var n=S.count;
  if(availCount()<n||!S.name.trim()||S.busy)return;
  S.busy=true;S.bankErr=null;render();
  var picked=[];
  try{picked=await fetchQuestions(S.grade,S.subject,S.lesson,n)}
  catch(e){S.busy=false;S.bankErr="មិនអាចទាញលំហាត់បានទេ។ "+errMsg(e);render();return}
  S.busy=false;
  if(picked.length<n){S.bankErr="មិនអាចទាញលំហាត់បានគ្រប់ចំនួនទេ។ សូមសាកល្បងម្តងទៀត ឬជ្រើសមេរៀនផ្សេង។";render();return}
  var qs=pickToRun(picked).map(function(q){q.chosen=null;return q});
  var by=uniq(picked.map(function(q){return q.by||""}));
  S.run={qs:qs,i:0,t0:Date.now(),confirm:false,id:certId(),grade:S.grade,subject:S.subject,
    lesson:S.lesson==="*"?"រួមគ្រប់មេរៀន":S.lesson,name:S.name.trim(),
    teacher:by.length===1?by[0]:"",certUrl:null,canvas:null,busy:false};
  S.view="quiz";render();window.scrollTo(0,0);
}
function viewQuiz(){
  var r=S.run,q=r.qs[r.i],last=r.i===r.qs.length-1;

  nav.append(h("button",{class:"btn",disabled:r.i===0,onclick:function(){r.i--;r.confirm=false;render()}},"ថយក្រោយ"));
  if(!last)nav.append(h("button",{class:"btn primary",onclick:function(){r.i++;r.confirm=false;render()}},"បន្ទាប់"));
  else nav.append(h("button",{class:"btn primary",onclick:function(){

    var jump=h("div",{class:"chips"});

    });
    card.append(jump);
  }
  return card;
}
function rating(p){
  if(p>=90)return"ល្អប្រសើរ";
  if(p>=80)return"ល្អណាស់";
  if(p>=65)return"ល្អ";
  if(p>=50)return"ល្អបង្គួរ";
  return"ត្រូវខិតខំបន្ថែម";
}
function mmss(ms){
  var t=Math.max(0,Math.round(ms/1000)),m=Math.floor(t/60),sec=t%60;
  if(m===0)return kn(sec)+" វិនាទី";
  return kn(m)+" នាទី"+(sec?" "+kn(sec)+" វិនាទី":"");
}
function finish(){
  var r=S.run;
  r.t1=Date.now();
  r.correct=r.qs.filter(function(x){return x.chosen===x.answer}).length;
  r.total=r.qs.length;
  r.pct=Math.round(r.correct/r.total*100);
  r.pass=r.correct*2>=r.total;
  r.s20=Math.round(r.correct/r.total*200)/10;
  S.view="result";render();window.scrollTo(0,0);
}

async function ensureCert(rr,drawer){

    try{r.canvas=await drawer(r,logo);r.certUrl=r.canvas.toDataURL("image/png")}
    catch(e){
      try{r.canvas=await drawer(r,null);r.certUrl=r.canvas.toDataURL("image/png")}
      catch(e2){r.canvas=null;r.busy=false;box=document.getElementById("certbox");if(box){box.textContent="";box.append(h("div",{class:"msg err"},"មិនអាចបង្កើតលិខិតបញ្ជាក់បានទេ។ សូមសាកល្បងម្តងទៀត។"))}return}

function saveCert(r){

  msg.textContent="";
  r.canvas.toBlob(function(blob){
    if(!blob){msg.append(h("div",{class:"msg err"},"មិនអាចទាញយកបានទេ។ សូមចុចសង្កត់លើរូបភាព រួចរក្សាទុក។"));return}

    setTimeout(function(){URL.revokeObjectURL(url)},4000);

  },"image/png");
}

var mlPromise=null;
function loadMathLive(){
  if(window.customElements&&customElements.get("math-field"))return Promise.resolve(true);
  if(!mlPromise){
    mlPromise=new Promise(function(res){
      var done=false;function fin(v){if(!done){done=true;if(!v)mlPromise=null;res(v)}}
      var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/mathlive";
      s.onload=function(){customElements.whenDefined("math-field").then(function(){fin(true)})};
      s.onerror=function(){fin(false)};
      document.head.append(s);
      setTimeout(function(){fin(false)},15000);
    });
  }
  return mlPromise;
}

function insertAtCursor(el,text){
  var s=el.selectionStart!=null?el.selectionStart:el.value.length;
  var e=el.selectionEnd!=null?el.selectionEnd:s;
  el.value=el.value.slice(0,s)+text+el.value.slice(e);
  var p=s+text.length;try{el.setSelectionRange(p,p)}catch(_){}
  el.dispatchEvent(new Event("input",{bubbles:true}));el.focus();
}

async function loadProfile(){
  var u=S.user;if(!u)return;
  try{
    var ref=fs.collection("users").doc(u.uid);
    var snap=await ref.get();
    if(snap.exists){S.profile=snap.data()}
    else{
      var p={name:u.displayName||u.email,email:u.email,status:S.isAdmin?"approved":"pending"};
      await ref.set(Object.assign({createdAt:ts()},p));
      S.profile=p;
    }
    S.authMsg=null;
  }catch(e){S.profile=null;S.authMsg={t:"err",m:errMsg(e)}}
}
async function loadBank(){

async function createRoom(){
  var name=S.name.trim(),n=S.bcount;
  if(!name||availCount()<n||S.busy)return;
  S.busy=true;S.bmsg=null;render();
  var code=null,me=null;
  try{
    me=await ensureMe();
    for(var k=0;k<6&&!code;k++){
      var c=String(Math.floor(100000+Math.random()*900000)),pl={};
      pl[me.uid]={name:name};
      try{
        await fs.collection("rooms").doc(c).set({host:me.uid,hostName:name,status:"lobby",grade:S.grade,subject:S.subject,
          lessonKey:S.lesson,lesson:S.lesson==="*"?"រួមគ្រប់មេរៀន":S.lesson,count:n,players:pl,createdAt:ts()});
        code=c;
      }catch(e){if(!e||e.code!=="permission-denied")throw e}
    }
    if(!code)throw{code:"permission-denied"};
  }catch(e){S.busy=false;S.bmsg={t:"err",m:batErr(e)};render();return}
  S.busy=false;
  btStart(code,me.uid,true);
}
async function joinRoom(){
  var name=S.name.trim(),code=toLatinDigits(S.bcode).trim();
  if(!name||!/^\d{6}$/.test(code)||S.busy)return;
  S.busy=true;S.bmsg=null;render();
  var me=null;
  try{
    me=await ensureMe();
    var ref=fs.collection("rooms").doc(code);
    await fs.runTransaction(async function(tx){
      var s=await tx.get(ref);
      if(!s.exists)throw{code:"room/not-found"};
      var d=s.data();
      if(d.status!=="lobby")throw{code:"room/started"};
      var pl=d.players||{};
      if(!pl[me.uid]&&Object.keys(pl).length>=10)throw{code:"room/full"};
      var u={};u["players."+me.uid]={name:name};
      tx.update(ref,u);
    });
  }catch(e){S.busy=false;S.bmsg={t:"err",m:batErr(e)};render();return}
  S.busy=false;
  btStart(code,me.uid,false);
}
function btStart(code,uid,isHost){
  btReset();
  BT={code:code,uid:uid,host:isHost,room:null,prog:{},bv:"lobby",i:0,chosen:null,correct:0,t0:0,timeMs:0,err:null,busy:false,writeErr:null,confirmEnd:false,u1:null,u2:null};
  var ref=fs.collection("rooms").doc(code);
  BT.u1=ref.onSnapshot(function(s){
    if(!BT)return;
    if(!s.exists){btReset();S.bmsg={t:"err",m:"បន្ទប់ត្រូវបានលុប ឬបិទ។"};S.view="bhome";render();return}
    BT.room=s.data();btOnRoom();
  },function(e){
    if(!BT)return;
    var m=batErr(e);btReset();S.bmsg={t:"err",m:m};S.view="bhome";render();
  });
  BT.u2=ref.collection("progress").onSnapshot(function(sn){
    if(!BT)return;
    var m={};sn.forEach(function(d){m[d.id]=d.data()});
    BT.prog=m;btOnProg();
  },function(){});
  S.view="blobby";render();window.scrollTo(0,0);
}
function btOnRoom(){

function btWrite(p){

function btRows(){
  var pl=BT.room.players||{};
  var rows=Object.keys(pl).map(function(id){
    var p=BT.prog[id]||{};
    return{uid:id,name:pl[id].name,answered:p.answered||0,correct:p.correct||0,finished:!!p.finished,
      timeMs:(p.finished&&p.timeMs!=null)?p.timeMs:Infinity};
  });
  rows.sort(function(a,b){
    return (b.correct-a.correct)||(a.timeMs-b.timeMs)||(b.answered-a.answered)||String(a.name).localeCompare(String(b.name));
  });
  rows.forEach(function(r,i){r.rank=i+1});
  return rows;
}
function btCheckFinal(){
  if(!BT||BT.bv==="lobby"||BT.bv==="final")return false;
  var r=BT.room,rows=btRows();
  var all=rows.length>0&&rows.every(function(x){return x.finished});
  if(!(all||r.status==="finished"))return false;
  var me=rows.filter(function(x){return x.uid===BT.uid})[0]||{correct:BT.correct,timeMs:Infinity,rank:rows.length};
  var tm=me.timeMs===Infinity?(BT.t0?Date.now()-BT.t0:0):me.timeMs;
  var nq=(r.qs||[]).length;
  var mine=(r.players[BT.uid]||{}).name||S.name;
  S.bres={uid:BT.uid,name:mine,rank:me.rank,total:rows.length,correct:me.correct,nq:nq,timeMs:tm,
    s20:nq?Math.round(me.correct/nq*200)/10:0,
    id:"BT-"+certId().slice(4),grade:r.grade,subject:r.subject,lesson:r.lesson,host:r.hostName,teacher:r.teacher||"",
    top:rows.slice(0,3).map(function(x){return x.name}),
    rows:rows.map(function(x){return{uid:x.uid,name:x.name,correct:x.correct,answered:x.answered,finished:x.finished,timeMs:x.timeMs,rank:x.rank}}),
    t1:Date.now(),canvas:null,certUrl:null,busy:false};
  btReset();
  S.view="bres";render();window.scrollTo(0,0);
  return true;
}
async function btStartGame(){

/* ---- report data ---- */
function plainText(t){return String(t==null?"":t).replace(/\$/g,"").replace(/\s+/g," ").trim()}
function lvReport(){
  var qs=LV.qs,n=qs.length,pl=LV.players,ids=Object.keys(pl);
  var rows=ids.map(function(id){
    var a=[],c=0,w=0,u=0;
    for(var i=0;i<n;i++){
      var ch=(LV.resp[i]||{})[id];
      if(ch==null||ch<0||ch>=qs[i].options.length){a.push(null);u++}
      else{a.push(ch);if(ch===qs[i].answer)c++;else w++}
    }
    return{uid:id,name:pl[id].name,no:pl[id].no||"",a:a,c:c,w:w,u:u,pct:n?c/n*100:0,s20:n?Math.round(c/n*200)/10:0};
  });
  rows.sort(function(a,b){return (b.c-a.c)||String(a.name).localeCompare(String(b.name))});
  rows.forEach(function(r,i){r.rank=i+1});
  var qst=qs.map(function(q,i){
    var m=LV.resp[i]||{},cnt=q.options.map(function(){return 0});
    Object.keys(m).forEach(function(id){if(pl[id]&&cnt[m[id]]!=null)cnt[m[id]]++});
    var ans=cnt.reduce(function(a,b){return a+b},0);
    return{i:i,q:plainText(q.q),ans:q.answer,cnt:cnt,answered:ans,none:ids.length-ans,right:cnt[q.answer]||0,pct:ids.length?(cnt[q.answer]||0)/ids.length*100:0};
  });
  var avg=rows.length?rows.reduce(function(a,r){return a+r.pct},0)/rows.length:0;
  var rm=LV.room||{};
  return{rows:rows,qst:qst,n:n,players:ids.length,avg:avg,
    info:{grade:rm.grade,subject:rm.subject,lesson:rm.lesson,teacher:rm.hostName||"",date:khDate(Date.now()),code:LV.code}};
}
async function lvDownload(kind){
  var msg=document.getElementById("lmsg");
  if(msg)msg.textContent="កំពុងបង្កើតឯកសារ...";
  try{
    var rep=lvReport();
    if(kind==="xlsx")saveBlob(buildXlsx(rep),"live-report-"+LV.code+".xlsx");
    else saveBlob(await buildPdf(rep),"live-report-"+LV.code+".pdf");
    msg=document.getElementById("lmsg");if(msg)msg.textContent="បានទាញយករួចហើយ។";
  }catch(e){msg=document.getElementById("lmsg");if(msg)msg.textContent="បង្កើតឯកសារមិនបាន៖ "+((e&&e.message)||e)}
}

  return (c2^0xFFFFFFFF)>>>0;

  });

  cd.forEach(function(e){

    var lines=blk.split("\n").map(function(l){return l.trim()}).filter(Boolean);
    if(!lines.length)return;
    var qlines=[],opts=[],ans=-1,exl=[],started=false,inEx=false;
    lines.forEach(function(l){
      var a=l.match(ansRe),e=l.match(exRe),m=l.match(optRe);
      if(a){started=true;var k=a[2].charAt(0).toLowerCase();if(map[k]!=null)ans=map[k]}
      else if(e){started=true;inEx=true;if(e[2])exl.push(e[2])}
      else if(inEx)exl.push(l);
      else if(m){started=true;opts.push(m[2].trim())}
      else if(!started)qlines.push(l);
      else if(opts.length)opts[opts.length-1]+=" "+l;
    });
    var ex=exl.join("\n");
    if(qlines.length>1&&labelRe.test(qlines[0]))qlines.shift();
    var qt=qlines.join("\n").replace(/^[\d០-៩]+\s*[\.\)។:]\s*/,"");
    if(!qt||opts.length<2||ans<0||ans>=opts.length){skipped++;return}
    recs.push({id:uid()+recs.length,grade:I.grade,subject:subject,lesson:lesson,q:qt,options:opts,answer:ans,explain:ex,ownerUid:S.user.uid,by:S.profile.name});
  });
  var made=0;
  if(recs.length){
    S.busy=true;render();
    try{await addMany(recs);made=recs.length;I.text=""}
    catch(e){S.busy=false;S.flash={t:"err",where:"text",m:errMsg(e)};render();return}
    S.busy=false;
  }
  S.flash={t:made?"ok":"err",where:"text",m:"បានបញ្ចូល "+kn(made)+" សំណួរ"+(skipped?" · រំលង "+kn(skipped)+" (ទម្រង់មិនត្រឹមត្រូវ)":"")+"។"};
  render();
}
async function importJSON(){
  var I=S.imp;
  try{
    var d=JSON.parse(I.json);
    var qs=Array.isArray(d)?d:d.questions;
    if(!Array.isArray(qs))throw 0;
    var recs=qs.filter(function(q){
      return q&&typeof q.q==="string"&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length&&GRADES.indexOf(q.grade)>=0&&typeof q.subject==="string";
    }).map(function(q,i){
      return{id:uid()+i,grade:q.grade,subject:q.subject,lesson:q.lesson||"",q:q.q,options:q.options.map(String),answer:q.answer,explain:q.explain||"",ownerUid:S.user.uid,by:S.profile.name};
    });
    S.busy=true;render();
    await addMany(recs);
    I.json="";S.busy=false;
    S.flash={t:"ok",where:"json",m:"បាននាំចូល "+kn(recs.length)+" សំណួរ។"};
  }catch(e){S.busy=false;S.flash={t:"err",where:"json",m:(e&&e.code)?errMsg(e):"JSON មិនត្រឹមត្រូវ។ សូមពិនិត្យម្តងទៀត។"}}
  render();
}

render();
})();
</script>
