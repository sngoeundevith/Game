<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>លំហាត់ QCM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{
  --bg:#f3f5fa;--surface:#ffffff;--ink:#142040;--muted:#5b6785;--line:#d9dfec;--soft:#e8edf9;
  --accent:#1e4bd2;--accent-ink:#ffffff;--gold:#b8861b;
  --good:#12805c;--good-bg:#dff3ea;--bad:#c23b3b;--bad-bg:#fbe3e3;
  --f-body:"Battambang",system-ui,sans-serif;
  --f-display:"Moul","Battambang",serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1426;--surface:#161e36;--ink:#e8ecf8;--muted:#9aa6c6;--line:#2a3558;--soft:#1e2847;
  --accent:#6f93ff;--accent-ink:#0e1426;--gold:#e0b04a;
  --good:#4cc79a;--good-bg:#12372c;--bad:#ff8a8a;--bad-bg:#3d1c20;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-block:20px 56px;padding-top:max(20px,env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
img{max-width:100%}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap.wide{max-width:980px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:64px;height:64px;object-fit:contain;flex:none}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.5;margin:0}
.brand small{color:var(--muted);display:block;line-height:1.4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{margin:0;font-size:18px;line-height:1.5}
.lbl{font-size:14px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;cursor:pointer;line-height:1.6}
.chip small{color:var(--muted);margin-left:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 18px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=text],input[type=email],input[type=password],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qtext{font-size:20px;line-height:1.7;margin:0;font-weight:500;overflow-wrap:anywhere}
.rich{white-space:pre-wrap;overflow-wrap:anywhere}
.rich .katex{font-size:1.08em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;min-width:0;width:100%}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:14px;line-height:1}
.opt span{flex:1;min-width:0;overflow-wrap:anywhere}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.opt[aria-pressed="true"] b{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok b{background:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no b{background:var(--bad);color:var(--surface)}
.opt.static{cursor:default}
.score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:132px;height:132px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--soft) 0)}
.ring div{width:104px;height:104px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.2}
.ring strong{font-family:var(--f-display);font-weight:400;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;flex:1 1 280px}
.stat{background:var(--bg);border-radius:10px;padding:8px 12px}
.stat small{display:block;color:var(--muted);line-height:1.5}
.stat b{font-size:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:13px;line-height:1.6;padding:0 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.tag.sample,.tag.no{background:var(--bad-bg);color:var(--bad)}
.tag.ok{background:var(--good-bg);color:var(--good)}
.tag.wait{background:#fff1cf;color:#8a5a00}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.qrow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.qrow p{margin:0;overflow-wrap:anywhere}
.qrow ol{margin:0;padding-left:0;list-style:none;display:grid;gap:2px;font-size:15px;color:var(--muted)}
.qrow li.c{color:var(--good);font-weight:700}
.note{font-size:14px;color:var(--muted);margin:0}
.msg{border-radius:10px;padding:8px 14px;background:var(--soft);font-size:15px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.ok{background:var(--good-bg);color:var(--good)}
.cert img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;display:block}
details.rv{border:1px solid var(--line);border-radius:12px;padding:8px 14px}
details.rv summary{cursor:pointer;display:flex;gap:10px;align-items:flex-start}
details.rv summary span{min-width:0;overflow-wrap:anywhere}
.mark{flex:none;font-weight:700}
.mark.ok{color:var(--good)}.mark.no{color:var(--bad)}
.pubbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.radio-row{display:flex;gap:10px;align-items:center}
.radio-row input[type=radio]{flex:none;width:20px;height:20px;accent-color:var(--accent)}
.urow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.urow .who{min-width:0;overflow-wrap:anywhere}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;padding:0 6px;margin-left:6px;line-height:1}
/* math */
.mathbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mathbar .btn.sm{padding:2px 10px}
.preview{border:1px dashed var(--line);border-radius:10px;padding:6px 12px;font-size:17px}
.preview:empty{display:none}
.ov{position:fixed;inset:0;background:rgba(10,16,34,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(720px,100%);display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:18px}
math-field{width:100%;font-size:28px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

<script>
(function(){
"use strict";
var CFG=window.APP_CONFIG||{};

var TITLE="លំហាត់ QCM";
var SUGGEST=["ភាសាខ្មែរ","គណិតវិទ្យា","វិទ្យាសាស្ត្រ","ប្រវត្តិវិទ្យា","ភូមិវិទ្យា","អង់គ្លេស","រូបវិទ្យា","គីមីវិទ្យា","ជីវវិទ្យា","សីលធម៌-ពលរដ្ឋ"];
var LET=["ក","ខ","គ","ឃ"];
var MONTHS=["មករា","កុម្ភៈ","មីនា","មេសា","ឧសភា","មិថុនា","កក្កដា","សីហា","កញ្ញា","តុលា","វិច្ឆិកា","ធ្នូ"];
var GRADES=[4,5,6,7,8,9,10,11,12];

function kn(s){return String(s).replace(/\d/g,function(d){return "០១២៣៤៥៦៧៨៩"[d]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function uid(){return "q"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i})}
function h(tag,props){
  var e=document.createElement(tag);props=props||{};
  Object.keys(props).forEach(function(k){
    var v=props[k];if(v==null||v===false)return;
    if(k==="class")e.className=v;
    else if(k.indexOf("on")===0)e[k]=v;
    else if(k==="value")e.value=v;
    else if(k==="checked")e.checked=true;
    else if(k==="disabled")e.disabled=true;
    else e.setAttribute(k,v===true?"":v);
  });
  for(var i=2;i<arguments.length;i++){add(e,arguments[i])}
  return e;
}
function add(e,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){add(e,x)});return}
  e.append(c.nodeType?c:document.createTextNode(String(c)));
}

/* ---------- math rendering: text with $latex$ ---------- */
function mathNode(latex){
  var s=document.createElement("span");
  if(window.katex){try{window.katex.render(latex,s,{throwOnError:false});return s}catch(e){}}
  s.textContent="$"+latex+"$";return s;
}
function rich(t){
  var e=document.createElement("span");e.className="rich";
  String(t==null?"":t).split(/(\$[^$]+\$)/g).forEach(function(p){
    if(!p)return;
    if(/^\$[^$]+\$$/.test(p))e.append(mathNode(p.slice(1,-1)));
    else e.append(document.createTextNode(p));
  });
  return e;
}

if(ONLINE){

function ts(){return window.firebase.firestore.FieldValue.serverTimestamp()}
function isAdminEmail(m){return !!CFG.adminEmail&&String(m||"").toLowerCase()===String(CFG.adminEmail).toLowerCase()}

var raw;try{raw=JSON.parse(document.getElementById("bank").textContent)}catch(e){raw={}}

var S={
  view:"home",teacher:false,tab:"add",
  grade:null,subject:null,lesson:"*",count:10,name:"",run:null,
  form:{grade:4,subject:"",lesson:"",q:"",o:["","","",""],ans:0,explain:"",editId:null},
  flt:{grade:"",subject:"",lesson:""},delId:null,flash:null,
  imp:{grade:4,subject:"",lesson:"",text:"",json:""},
  loadingBank:ONLINE,bankErr:null,
  authReady:!ONLINE,user:null,profile:null,isAdmin:false,registering:false,busy:false,
  authMode:"login",authForm:{name:"",email:"",pw:""},authMsg:null,
  users:null,usersErr:null
};

function pool(){
  return bank.filter(function(q){return q.grade===S.grade&&q.subject===S.subject&&(S.lesson==="*"||q.lesson===S.lesson)});
}
function errMsg(e){
  var c=e&&e.code||"";
  var m={
    "auth/email-already-in-use":"អ៊ីមែលនេះត្រូវបានប្រើរួចហើយ។",
    "auth/invalid-email":"ទម្រង់អ៊ីមែលមិនត្រឹមត្រូវ។",
    "auth/weak-password":"ពាក្យសម្ងាត់ខ្សោយពេក (យ៉ាងតិច ៦ តួ)។",
    "auth/invalid-credential":"អ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ។",
    "auth/user-not-found":"អ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ។",
    "auth/wrong-password":"អ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ។",
    "auth/too-many-requests":"ព្យាយាមច្រើនដងពេក។ សូមរង់ចាំបន្តិចសិន។",
    "auth/network-request-failed":"គ្មានអ៊ីនធឺណិត ឬបណ្តាញមានបញ្ហា។",
    "auth/operation-not-allowed":"Firebase មិនទាន់បើកការចូលដោយ Email/Password ទេ។",
    "permission-denied":"គ្មានសិទ្ធិធ្វើសកម្មភាពនេះទេ។ (ពិនិត្យ Firestore Rules និងស្ថានភាពគណនី)"
  };
  return m[c]||("មានបញ្ហា៖ "+(c||(e&&e.message)||"មិនស្គាល់"));
}

/* ---------- shell ---------- */
var app=document.getElementById("app");
function render(){
  app.textContent="";
  var inQuiz=S.view==="quiz";
  var wrap=h("div",{class:"wrap"+(S.teacher&&!inQuiz?" wide":"")});
  var nav=h("div",{class:"row"});
  if(!inQuiz){
    nav.append(h("button",{class:"btn sm",onclick:function(){S.teacher=!S.teacher;S.view=S.teacher?"teacher":"home";S.flash=null;render()}},S.teacher?"ទំព័រសិស្ស":"ផ្នែកគ្រូ"));
  }
  wrap.append(h("div",{class:"top"},
    h("div",{class:"brand"},
      h("img",{class:"logo",src:LOGO,alt:"Logo",onerror:function(){this.style.display="none"}}),
      h("div",{},h("h1",{},TITLE),SCHOOL?h("small",{},SCHOOL):null)),
    nav));
  var v=S.view;
  if(v==="home")wrap.append(viewHome());
  else if(v==="quiz")wrap.append(viewQuiz());
  else if(v==="result")wrap.append(viewResult());
  else wrap.append(viewTeacher());
  app.append(wrap);
  if(v==="result")ensureCert();
}

/* ---------- student: home ---------- */
function chip(label,count,on,fn){
  return h("button",{class:"chip","aria-pressed":on?"true":"false",onclick:fn},label,count!=null?h("small",{},kn(count)):null);
}
function viewHome(){
  var box=h("div",{class:"card"});
  box.append(h("h2",{},"ជ្រើសរើសលំហាត់"));
  if(S.loadingBank){box.append(h("p",{class:"note"},"កំពុងផ្ទុកលំហាត់..."))}
  else if(S.bankErr){box.append(h("div",{class:"msg err"},S.bankErr),h("div",{class:"row"},h("button",{class:"btn sm",onclick:loadBank},"ព្យាយាមម្តងទៀត")))}
  box.append(h("div",{class:"lbl"},"ថ្នាក់"));
  var cg=h("div",{class:"chips"});
  GRADES.forEach(function(g){
    var n=bank.filter(function(q){return q.grade===g}).length;
    cg.append(chip("ថ្នាក់ទី"+kn(g),n,S.grade===g,function(){S.grade=g;S.subject=null;S.lesson="*";render()}));
  });
  box.append(cg);
  var avail=0;
  if(S.grade!=null){
    var subs=uniq(bank.filter(function(q){return q.grade===S.grade}).map(function(q){return q.subject}));
    if(!subs.length){
      box.append(h("p",{class:"note"},"ថ្នាក់នេះមិនទាន់មានលំហាត់ទេ។ សូមជ្រើសថ្នាក់ផ្សេង ឬឱ្យគ្រូបន្ថែមលំហាត់។"));
    }else{
      box.append(h("div",{class:"lbl"},"មុខវិជ្ជា"));
      var cs=h("div",{class:"chips"});
      subs.forEach(function(s){
        var n=bank.filter(function(q){return q.grade===S.grade&&q.subject===s}).length;
        cs.append(chip(s,n,S.subject===s,function(){S.subject=s;S.lesson="*";render()}));
      });
      box.append(cs);
    }
  }
  if(S.grade!=null&&S.subject){
    var base=bank.filter(function(q){return q.grade===S.grade&&q.subject===S.subject});
    var ls=uniq(base.map(function(q){return q.lesson}));
    box.append(h("div",{class:"lbl"},"មេរៀន"));
    var cl=h("div",{class:"chips"});
    cl.append(chip("គ្រប់មេរៀន",base.length,S.lesson==="*",function(){S.lesson="*";render()}));
    ls.forEach(function(l){
      var n=base.filter(function(q){return q.lesson===l}).length;
      cl.append(chip(l||"(មិនមានឈ្មោះមេរៀន)",n,S.lesson===l,function(){S.lesson=l;render()}));
    });
    box.append(cl);
    avail=pool().length;
    box.append(h("div",{class:"lbl"},"ចំនួនសំណួរ"));
    var cc=h("div",{class:"chips"});
    [5,10,15,20].filter(function(n){return n<avail}).forEach(function(n){
      cc.append(chip(kn(n),null,S.count===n,function(){S.count=n;render()}));
    });
    cc.append(chip("ទាំងអស់ ("+kn(avail)+")",null,S.count==="all"||(typeof S.count==="number"&&S.count>=avail),function(){S.count="all";render()}));
    box.append(cc);
  }
  var nameIn=h("input",{type:"text",id:"stu-name",placeholder:"ឈ្មោះពេញរបស់អ្នក",value:S.name,autocomplete:"name",maxlength:"60"});
  var go=h("button",{class:"btn primary",disabled:!(avail>0&&S.name.trim()),onclick:startQuiz},"ចាប់ផ្តើមលំហាត់");
  nameIn.oninput=function(){S.name=nameIn.value;go.disabled=!(avail>0&&S.name.trim())};
  var who=h("div",{class:"card"},
    h("h2",{},"ព័ត៌មានរបស់អ្នក"),
    h("div",{class:"field"},h("label",{class:"lbl","for":"stu-name"},"ឈ្មោះសិស្ស"),nameIn),
    h("p",{class:"note"},"ឈ្មោះនេះនឹងបង្ហាញលើលិខិតបញ្ជាក់។ សូមសរសេរឱ្យត្រឹមត្រូវ។"),
    go);
  var frag=document.createDocumentFragment();
  frag.append(box,who);
  return frag;
}

/* ---------- student: quiz ---------- */
function certId(){
  var d=new Date();
  return "QCM-"+String(d.getFullYear()).slice(2)+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
}
function startQuiz(){
  var p=pool();if(!p.length||!S.name.trim())return;
  var n=S.count==="all"?p.length:Math.min(S.count,p.length);
  var picked=shuffle(p).slice(0,n);
  var qs=picked.map(function(q){
    var idx=shuffle(q.options.map(function(_,i){return i}));
    return{q:q.q,options:idx.map(function(i){return q.options[i]}),answer:idx.indexOf(q.answer),explain:q.explain||"",chosen:null};
  });
  var by=uniq(picked.map(function(q){return q.by||""}));
  S.run={qs:qs,i:0,t0:Date.now(),confirm:false,id:certId(),grade:S.grade,subject:S.subject,
    lesson:S.lesson==="*"?"រួមគ្រប់មេរៀន":S.lesson,name:S.name.trim(),
    teacher:by.length===1?by[0]:"",certUrl:null,canvas:null,busy:false};
  S.view="quiz";render();window.scrollTo(0,0);
}
function viewQuiz(){
  var r=S.run,q=r.qs[r.i],last=r.i===r.qs.length-1;
  var answered=r.qs.filter(function(x){return x.chosen!=null}).length;
  var card=h("div",{class:"card"});
  card.append(h("div",{class:"row",style:"justify-content:space-between"},
    h("span",{class:"lbl"},"សំណួរទី"+kn(r.i+1)+" / "+kn(r.qs.length)),
    h("span",{class:"lbl"},"បានឆ្លើយ "+kn(answered))));
  card.append(h("div",{class:"bar"},h("i",{style:"width:"+((r.i+1)/r.qs.length*100)+"%"})));
  card.append(h("p",{class:"qtext"},rich(q.q)));
  var opts=h("div",{class:"opts"});
  q.options.forEach(function(o,i){
    opts.append(h("button",{class:"opt","aria-pressed":q.chosen===i?"true":"false",onclick:function(){q.chosen=i;r.confirm=false;render()}},
      h("b",{},LET[i]),h("span",{},rich(o))));
  });
  card.append(opts);
  var nav=h("div",{class:"row",style:"justify-content:space-between"});
  nav.append(h("button",{class:"btn",disabled:r.i===0,onclick:function(){r.i--;r.confirm=false;render()}},"ថយក្រោយ"));
  if(!last)nav.append(h("button",{class:"btn primary",onclick:function(){r.i++;r.confirm=false;render()}},"បន្ទាប់"));
  else nav.append(h("button",{class:"btn primary",onclick:function(){
    if(answered<r.qs.length&&!r.confirm){r.confirm=true;render()}else finish();
  }},"បញ្ជូនចម្លើយ"));
  card.append(nav);
  if(r.confirm){
    card.append(h("div",{class:"msg err"},"នៅសល់ "+kn(r.qs.length-answered)+" សំណួរដែលមិនទាន់ឆ្លើយ។ ចុច «បញ្ជូនចម្លើយ» ម្តងទៀតដើម្បីបញ្ចប់ ឬជ្រើសសំណួរមុនៗដើម្បីបំពេញ។"));
    var jump=h("div",{class:"chips"});
    r.qs.forEach(function(x,i){
      if(x.chosen==null)jump.append(h("button",{class:"chip",onclick:function(){r.i=i;r.confirm=false;render()}},"ទី"+kn(i+1)));
    });
    card.append(jump);
  }
  return card;
}
function rating(p){
  if(p>=90)return"ល្អប្រសើរ";
  if(p>=80)return"ល្អណាស់";
  if(p>=65)return"ល្អ";
  if(p>=50)return"ល្អបង្គួរ";
  return"ត្រូវខិតខំបន្ថែម";
}
function mmss(ms){
  var t=Math.max(0,Math.round(ms/1000)),m=Math.floor(t/60),sec=t%60;
  if(m===0)return kn(sec)+" វិនាទី";
  return kn(m)+" នាទី"+(sec?" "+kn(sec)+" វិនាទី":"");
}
function finish(){
  var r=S.run;
  r.t1=Date.now();
  r.correct=r.qs.filter(function(x){return x.chosen===x.answer}).length;
  r.total=r.qs.length;
  r.pct=Math.round(r.correct/r.total*100);
  r.s20=Math.round(r.correct/r.total*200)/10;
  S.view="result";render();window.scrollTo(0,0);
}

/* ---------- student: result ---------- */
function stat(l,v){return h("div",{class:"stat"},h("small",{},l),h("b",{},v))}
function viewResult(){
  var r=S.run;
  var frag=document.createDocumentFragment();
  var top=h("div",{class:"card"});
  top.append(h("h2",{},"លទ្ធផលរបស់ "+r.name));
  top.append(h("div",{class:"score"},
    h("div",{class:"ring",style:"--p:"+r.pct},h("div",{},h("div",{},h("strong",{},kn(r.pct)+"%")))),
    h("div",{class:"stats"},
      stat("ចម្លើយត្រូវ",kn(r.correct)+" / "+kn(r.total)),
      stat("ពិន្ទុ",kn(String(r.s20))+" / "+kn(20)),
      stat("ការវាយតម្លៃ",rating(r.pct)),
      stat("ពេលវេលា",mmss(r.t1-r.t0)))));
  top.append(h("p",{class:"note"},"ថ្នាក់ទី"+kn(r.grade)+" · "+r.subject+" · "+r.lesson));
  top.append(h("div",{class:"row"},
    h("button",{class:"btn primary",onclick:startQuizAgain},"ធ្វើម្តងទៀត"),
    h("button",{class:"btn",onclick:function(){S.view="home";S.run=null;render();window.scrollTo(0,0)}},"ជ្រើសលំហាត់ផ្សេង")));
  frag.append(top);

  var cert=h("div",{class:"card cert"});
  cert.append(h("h2",{},"លិខិតបញ្ជាក់"));
  cert.append(h("div",{id:"certbox"},h("p",{class:"note"},"កំពុងរៀបចំលិខិតបញ្ជាក់...")));
  cert.append(h("div",{class:"row",id:"certact"}));
  cert.append(h("div",{id:"certmsg"}));

  /* Subject / grade band */
  var lineA="វិញ្ញាសា៖ "+r.subject+"  ថ្នាក់ទី"+kn(r.grade);
  x.fillStyle=NAVY;fit(x,lineA,F2,"700",40,1060);x.fillText(lineA,cx,634);
  var lineB="មេរៀន៖ "+r.lesson;
  x.fillStyle=NAVY;fit(x,lineB,F2,"400",38,1300);x.fillText(lineB,cx,704);
  var sen="បានចូលរួមធ្វើលំហាត់ជ្រើសរើសចម្លើយ (QCM) ហើយទទួលបានលទ្ធផលដូចខាងក្រោម៖";
  x.fillStyle=MUTED;fit(x,sen,F2,"400",32,1300);x.fillText(sen,cx,760);

  var boxes=[["ចម្លើយត្រូវ",kn(r.correct)+" / "+kn(r.total)],["ពិន្ទុ",kn(String(r.s20))+" / "+kn(20)],["ភាគរយ",kn(r.pct)+"%"]];
  var bw=360,gap=40,bx=(W-(bw*3+gap*2))/2,by=795,bh=125;
  boxes.forEach(function(b,i){
    var px=bx+i*(bw+gap);

var mlPromise=null;
function loadMathLive(){
  if(window.customElements&&customElements.get("math-field"))return Promise.resolve(true);

    mlPromise=new Promise(function(res){
      var done=false;function fin(v){if(!done){done=true;if(!v)mlPromise=null;res(v)}}
      var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/mathlive";

function insertAtCursor(el,text){
  var s=el.selectionStart!=null?el.selectionStart:el.value.length;
  var e=el.selectionEnd!=null?el.selectionEnd:s;
  el.value=el.value.slice(0,s)+text+el.value.slice(e);

  el.dispatchEvent(new Event("input",{bubbles:true}));el.focus();
}

        q.by?h("span",{class:"tag"},"ដោយ "+q.by):null,
        q.sample?h("span",{class:"tag sample"},"ឧទាហរណ៍"):null),
      h("p",{},rich(q.q)),ol,ctl));
  });
  return card;
}
async function addMany(recs){
  for(var i=0;i<recs.length;i+=400){
    var b=fs.batch();
    recs.slice(i,i+400).forEach(function(r){
      var d=Object.assign({},r);delete d.id;
      b.set(fs.collection("questions").doc(r.id),Object.assign({updatedAt:ts()},d));
    });
    await b.commit();
  }
  recs.forEach(function(r){bank.push(r)});
}
async function seedSamples(){
  var recs=SAMPLES.map(function(q){return{id:uid()+q.id,grade:q.grade,subject:q.subject,lesson:q.lesson||"",q:q.q,options:q.options,answer:q.answer,explain:q.explain||"",sample:true,ownerUid:S.user.uid,by:S.profile.name}});
  try{await addMany(recs);S.flash={t:"ok",where:"list",m:"បានបញ្ចូលលំហាត់ឧទាហរណ៍។"}}
  catch(e){S.flash={t:"err",where:"list",m:errMsg(e)}}
  render();
}
async function deleteSamples(){
  var ids=bank.filter(function(q){return q.sample}).map(function(q){return q.id});
  try{
    for(var i=0;i<ids.length;i+=400){
      var b=fs.batch();ids.slice(i,i+400).forEach(function(id){b.delete(fs.collection("questions").doc(id))});
      await b.commit();
    }
    bank=bank.filter(function(q){return !q.sample});
  }catch(e){S.flash={t:"err",where:"list",m:errMsg(e)}}
  render();
}

  b.append(h("div",{class:"field"},h("label",{class:"lbl","for":"j-out"},"ទិន្នន័យបច្ចុប្បន្ន"),out));

      jm.textContent="";

async function importText(){
  var I=S.imp;
  var subject=I.subject.trim(),lesson=I.lesson.trim();
  if(!subject){S.flash={t:"err",where:"text",m:"សូមបំពេញមុខវិជ្ជាសិន។"};render();return}
  var map={"ក":0,"ខ":1,"គ":2,"ឃ":3,"a":0,"b":1,"c":2,"d":3};
  var optRe=/^([កខគឃA-Da-d])\s*[\.\)\:។]\s*(.+)$/;
  var ansRe=/^(ចម្លើយត្រឹមត្រូវ|ចម្លើយ|answer)\s*[:：៖]\s*(\S+)/i;
  var exRe=/^(ពន្យល់|explain)\s*[:：៖]\s*(.*)$/i;
  var labelRe=/^(សំណួរ(ទី)?|question)\s*[\d០-៩]*\s*[:：៖\.\)។]?\s*$/i;
  var blocks=I.text.split(/\n\s*\n/),recs=[],skipped=0;
  blocks.forEach(function(blk){
    var lines=blk.split("\n").map(function(l){return l.trim()}).filter(Boolean);
    if(!lines.length)return;
    var qlines=[],opts=[],ans=-1,exl=[],started=false,inEx=false;
    lines.forEach(function(l){
      var a=l.match(ansRe),e=l.match(exRe),m=l.match(optRe);
      if(a){started=true;var k=a[2].charAt(0).toLowerCase();if(map[k]!=null)ans=map[k]}
      else if(e){started=true;inEx=true;if(e[2])exl.push(e[2])}
      else if(inEx)exl.push(l);
      else if(m){started=true;opts.push(m[2].trim())}
      else if(!started)qlines.push(l);
      else if(opts.length)opts[opts.length-1]+=" "+l;
    });
    var ex=exl.join("\n");
    if(qlines.length>1&&labelRe.test(qlines[0]))qlines.shift();
    var qt=qlines.join("\n").replace(/^[\d០-៩]+\s*[\.\)។:]\s*/,"");
    if(!qt||opts.length<2||ans<0||ans>=opts.length){skipped++;return}
    recs.push({id:uid()+recs.length,grade:I.grade,subject:subject,lesson:lesson,q:qt,options:opts,answer:ans,explain:ex,ownerUid:S.user.uid,by:S.profile.name});
  });
  var made=0;
  if(recs.length){
    S.busy=true;render();
    try{await addMany(recs);made=recs.length;I.text=""}
    catch(e){S.busy=false;S.flash={t:"err",where:"text",m:errMsg(e)};render();return}
    S.busy=false;
  }
  S.flash={t:made?"ok":"err",where:"text",m:"បានបញ្ចូល "+kn(made)+" សំណួរ"+(skipped?" · រំលង "+kn(skipped)+" (ទម្រង់មិនត្រឹមត្រូវ)":"")+"។"};
  render();
}
async function importJSON(){
  var I=S.imp;
  try{
    var d=JSON.parse(I.json);
    var qs=Array.isArray(d)?d:d.questions;
    if(!Array.isArray(qs))throw 0;
    var recs=qs.filter(function(q){
      return q&&typeof q.q==="string"&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length&&GRADES.indexOf(q.grade)>=0&&typeof q.subject==="string";
    }).map(function(q,i){
      return{id:uid()+i,grade:q.grade,subject:q.subject,lesson:q.lesson||"",q:q.q,options:q.options.map(String),answer:q.answer,explain:q.explain||"",ownerUid:S.user.uid,by:S.profile.name};
    });
    S.busy=true;render();
    await addMany(recs);
    I.json="";S.busy=false;
    S.flash={t:"ok",where:"json",m:"បាននាំចូល "+kn(recs.length)+" សំណួរ។"};
  }catch(e){S.busy=false;S.flash={t:"err",where:"json",m:(e&&e.code)?errMsg(e):"JSON មិនត្រឹមត្រូវ។ សូមពិនិត្យម្តងទៀត។"}}
  render();
}

render();
